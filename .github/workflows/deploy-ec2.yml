name: Deploy To EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      EC2_APP_USER: ${{ secrets.EC2_APP_USER }}
      EC2_APP_PORT: ${{ secrets.EC2_APP_PORT }}
      EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate deploy secrets
        shell: bash
        run: |
          missing=()
          for key in EC2_HOST EC2_USER EC2_APP_DIR EC2_APP_USER EC2_APP_PORT EC2_ENV_FILE EC2_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            echo "Configure them in: Settings -> Secrets and variables -> Actions" >&2
            exit 1
          fi

      - name: Verify Python syntax
        shell: bash
        run: |
          python -m compileall server.py database.py duckdb_analytics.py build_duckdb.py

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.EC2_SSH_PRIVATE_KEY }}

      - name: Trust EC2 host key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Sync code to EC2
        shell: bash
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" "mkdir -p '${EC2_APP_DIR}'"
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude "*.pyo" \
            --exclude "venv" \
            --exclude ".env" \
            --exclude "logs/*" \
            --exclude "data/*.duckdb" \
            --exclude "data/*.duckdb.wal" \
            --exclude "*.db" \
            -e "ssh" \
            ./ "${EC2_USER}@${EC2_HOST}:${EC2_APP_DIR}/"

      - name: Write remote env file
        shell: bash
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" "mkdir -p '${EC2_APP_DIR}'"
          printf '%s' "${EC2_ENV_FILE}" | ssh "${EC2_USER}@${EC2_HOST}" "cat > '${EC2_APP_DIR}/.env'"

      - name: Run remote deploy
        shell: bash
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" "\
            cd '${EC2_APP_DIR}' && \
            chmod +x scripts/deploy_remote.sh scripts/rebuild_analytics.sh && \
            APP_DIR='${EC2_APP_DIR}' \
            APP_USER='${EC2_APP_USER}' \
            PORT='${EC2_APP_PORT}' \
            SERVICE_NAME='myntra_dashboard' \
            bash scripts/deploy_remote.sh"

      - name: Show remote deploy status
        shell: bash
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" "\
            cat '${EC2_APP_DIR}/tmp/analytics_rebuild_status.json' 2>/dev/null || true; \
            echo; \
            sudo systemctl status myntra_dashboard --no-pager -n 10"
