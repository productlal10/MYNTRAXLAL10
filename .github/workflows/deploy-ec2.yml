name: Deploy To EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python syntax
        run: python -m compileall server.py database.py duckdb_analytics.py build_duckdb.py

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Trust EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude "*.pyo" \
            --exclude "venv" \
            --exclude ".env" \
            --exclude "logs/*" \
            --exclude "data/*.duckdb" \
            --exclude "data/*.duckdb.wal" \
            --exclude "*.db" \
            -e "ssh" \
            ./ "${EC2_USER}@${EC2_HOST}:${EC2_APP_DIR}/"

      - name: Write remote env file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" "mkdir -p '${EC2_APP_DIR}'"
          printf '%s' "${EC2_ENV_FILE}" | ssh "${EC2_USER}@${EC2_HOST}" "cat > '${EC2_APP_DIR}/.env'"

      - name: Run remote deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_APP_USER: ${{ secrets.EC2_APP_USER }}
          EC2_APP_PORT: ${{ secrets.EC2_APP_PORT }}
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" "\
            cd '${EC2_APP_DIR}' && \
            chmod +x scripts/deploy_remote.sh scripts/rebuild_analytics.sh && \
            APP_DIR='${EC2_APP_DIR}' \
            APP_USER='${EC2_APP_USER}' \
            PORT='${EC2_APP_PORT}' \
            SERVICE_NAME='myntra_dashboard' \
            bash scripts/deploy_remote.sh"

      - name: Show remote deploy status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" "\
            cat '${EC2_APP_DIR}/tmp/analytics_rebuild_status.json' 2>/dev/null || true; \
            echo; \
            sudo systemctl status myntra_dashboard --no-pager -n 10"
